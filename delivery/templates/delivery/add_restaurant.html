<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meal Mate - Add Restaurant</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f5ee;
            color: #164c3b;
        }

        .navbar {
            height: 72px;
            background: white;
            border-top: 4px solid #ef7547;
            border-bottom: 1px solid #ddd;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #164c3b;
        }

        .logo span {
            color: #ef7547;
        }

        .home {
            color: #164c3b;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 650px;
            max-width: 92%;

            margin: 55px auto;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            color: #164c3b;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .error {
            background: #ffe5e0;
            color: #b42318;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 20px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            color: #164c3b;
        }

        .form-group {
            margin-bottom: 22px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #164c3b;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 6px;

            background: #164c3b;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #ef7547;
        }

    </style>

</head>


<body>


<header class="navbar">

    <div class="logo">
        Meal <span>Mate</span>
    </div>

    <a href="/" class="home">
        Home
    </a>

</header>


<div class="container">

    <h1>Add Restaurant</h1>

    <p class="subtitle">
        Add a new restaurant to Meal Mate.
    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <!-- IMPORTANT: FORM STARTS HERE -->

    <form method="POST" action="/add_restaurant">

        {% csrf_token %}


        <!-- NAME -->

        <div class="form-group">

            <label for="name">
                Restaurant Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter restaurant name"
                required
            >

        </div>


        <!-- PICTURE -->

        <div class="form-group">

            <label for="picture">
                Picture URL
            </label>

            <input
                type="url"
                id="picture"
                name="picture"
                placeholder="https://example.com/image.jpg"
                required
            >

        </div>


        <!-- CUISINE -->

        <div class="form-group">

            <label for="cuisine">
                Cuisine
            </label>

            <input
                type="text"
                id="cuisine"
                name="cuisine"
                placeholder="Pizza"
                required
            >

        </div>


        <!-- RATING -->

        <div class="form-group">

            <label for="rating">
                Rating
            </label>

            <input
                type="number"
                id="rating"
                name="rating"
                min="0"
                max="5"
                step="0.1"
                placeholder="4.5"
                required
            >

        </div>


        <button type="submit">
            Add Restaurant →
        </button>


    </form>

</div>


</body>

</html>
