<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Item Added - Meal Mate</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f5ee;
            color: #164f3d;
        }

        header {
            height: 80px;
            background: #fffefa;
            border-top: 3px solid #ff633f;
            border-bottom: 1px solid #dedbd2;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 30px;
            font-weight: bold;
            color: #164f3d;
        }

        .logo span {
            color: #f26745;
        }

        .cart {
            text-decoration: none;
            background: #145540;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
        }

        .container {
            width: 650px;
            max-width: 90%;
            margin: 100px auto;
            text-align: center;
        }

        .card {
            background: #fffefa;
            border: 1px solid #dedbd2;
            border-radius: 18px;
            padding: 55px 40px;

            box-shadow: 0 15px 35px rgba(20, 85, 64, 0.08);
        }

        .icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #e8f3ed;
            color: #145540;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            font-family: Georgia, serif;
            color: #145540;
            font-size: 36px;
            margin-bottom: 15px;
        }

        .message {
            color: #60766d;
            font-size: 17px;
            margin-bottom: 15px;
        }

        .item {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .button {
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 8px;
            font-weight: bold;
        }

        .continue {
            background: #145540;
            color: white;
        }

        .go-cart {
            background: #f7e5df;
            color: #d94d2e;
        }

        footer {
            margin-top: 40px;
            color: #789087;
            font-size: 14px;
        }

    </style>

</head>

<body>

<header>

    <div class="logo">
        Meal <span>Mate</span>
    </div>

    <a
        href="/show_cart/{{ username }}"
        class="cart"
    >
        🛒 Cart
    </a>

</header>


<div class="container">

    <div class="card">

        <div class="icon">
            ✓
        </div>

        <h1>
            Item Added to Cart!
        </h1>

        <p class="message">
            Your item has been successfully added to your cart.
        </p>

        <div class="item">
            {{ item.name }}
        </div>

        <div class="buttons">

            <a
                href="/view_menu/{{ item.restaurant.id }}/{{ username }}"
                class="button continue"
            >
                ← Continue Shopping
            </a>

            <a
                href="/show_cart/{{ username }}"
                class="button go-cart"
            >
                🛒 Go to Cart
            </a>

        </div>

    </div>

    <footer>
        Meal Mate · Fresh meals, thoughtfully delivered.
    </footer>

</div>

</body>

</html>
