<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meal Mate - Create Account</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            background: #f7f5ee;

            color: #164c3b;

            min-height: 100vh;
        }


        a {
            text-decoration: none;
        }


        /* =================================
           NAVBAR
        ================================= */

        .navbar {

            height: 72px;

            background: #fffef9;

            border-top: 4px solid #ef7547;

            border-bottom: 1px solid #e5e1d7;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 6%;
        }


        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            color: #164c3b;

            font-size: 27px;

            font-weight: bold;
        }


        .logo span {

            color: #ef7547;
        }


        .logo-icon {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            background: #164c3b;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;
        }


        .home-link {

            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            color: #164c3b;

            font-size: 17px;

            font-weight: bold;

            padding-bottom: 6px;

            border-bottom: 2px solid #ef7547;
        }


        .nav-right {

            display: flex;

            align-items: center;

            gap: 28px;
        }


        .signin-link {

            color: #164c3b;

            font-weight: bold;

            font-size: 16px;
        }


        .signin-link:hover {

            color: #ef7547;
        }


        .account-button {

            background: #164c3b;

            color: white;

            padding: 12px 22px;

            border-radius: 5px;

            font-weight: bold;

            font-size: 15px;
        }


        /* =================================
           MAIN
        ================================= */

        .page {

            min-height: calc(100vh - 72px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 6%;
        }


        .signup-container {

            width: 100%;

            max-width: 1050px;

            min-height: 650px;

            background: #fffef9;

            border-radius: 20px;

            overflow: hidden;

            display: grid;

            grid-template-columns: 46% 54%;

            box-shadow:
                0 18px 50px rgba(22, 76, 59, 0.12);
        }


        /* =================================
           LEFT FOOD SECTION
        ================================= */

        .food-section {

            position: relative;

            min-height: 650px;

            overflow: hidden;

            display: flex;

            align-items: flex-end;

            padding: 42px;
        }


        .food-section::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(22, 76, 59, 0.05),
                    rgba(22, 76, 59, 0.65)
                );

            z-index: 1;
        }


        .food-image {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        .food-content {

            position: relative;

            z-index: 2;

            color: white;

            max-width: 400px;
        }


        .food-small {

            font-size: 13px;

            letter-spacing: 4px;

            font-weight: bold;

            margin-bottom: 15px;
        }


        .food-title {

            font-size: 48px;

            line-height: 1;

            margin-bottom: 18px;
        }


        .food-title span {

            color: #ef7547;
        }


        .food-description {

            font-size: 17px;

            line-height: 1.6;

            color: #f7f7f7;
        }


        .food-tag {

            display: inline-block;

            margin-top: 22px;

            padding: 9px 15px;

            background: rgba(255,255,255,0.9);

            color: #164c3b;

            border-radius: 20px;

            font-size: 14px;

            font-weight: bold;
        }


        /* =================================
           FORM SECTION
        ================================= */

        .form-section {

            padding: 48px 55px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .form-title {

            font-size: 43px;

            color: #164c3b;

            margin-bottom: 8px;
        }


        .form-subtitle {

            color: #68736e;

            font-size: 16px;

            margin-bottom: 27px;
        }


        .form-group {

            margin-bottom: 17px;
        }


        .form-group label {

            display: block;

            color: #164c3b;

            font-size: 15px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .form-group input,
        .form-group textarea {

            width: 100%;

            border: 1px solid #d6dcd7;

            background: #fff;

            border-radius: 7px;

            padding: 13px 15px;

            font-family: Arial, sans-serif;

            font-size: 15px;

            color: #333;

            outline: none;

            transition: 0.2s;
        }


        .form-group input {

            height: 48px;
        }


        .form-group textarea {

            height: 75px;

            resize: none;
        }


        .form-group input:focus,
        .form-group textarea:focus {

            border-color: #164c3b;

            box-shadow:
                0 0 0 3px rgba(22, 76, 59, 0.08);
        }


        .form-group input::placeholder,
        .form-group textarea::placeholder {

            color: #999;
        }


        /* =================================
           CREATE BUTTON
        ================================= */

        .create-button {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 7px;

            background: #164c3b;

            color: white;

            font-family: Georgia, serif;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.3s;
        }


        .create-button:hover {

            background: #0d392d;

            transform: translateY(-1px);
        }


        /* =================================
           BOTTOM
        ================================= */

        .bottom-text {

            text-align: center;

            margin-top: 18px;

            color: #777;

            font-size: 15px;
        }


        .bottom-text a {

            color: #ef7547;

            font-weight: bold;
        }


        .bottom-text a:hover {

            text-decoration: underline;
        }


        /* =================================
           RESPONSIVE
        ================================= */

        @media (max-width: 900px) {

            .signup-container {

                grid-template-columns: 1fr;

                max-width: 600px;
            }


            .food-section {

                min-height: 300px;

                padding: 30px;
            }


            .food-title {

                font-size: 38px;
            }


            .form-section {

                padding: 40px;
            }


            .home-link {

                display: none;
            }
        }


        @media (max-width: 600px) {

            .navbar {

                padding: 0 20px;
            }


            .logo {

                font-size: 22px;
            }


            .nav-right {

                gap: 12px;
            }


            .signin-link {

                display: none;
            }


            .account-button {

                padding: 10px 15px;
            }


            .page {

                padding: 20px 15px;
            }


            .signup-container {

                border-radius: 14px;
            }


            .food-section {

                min-height: 260px;
            }


            .form-section {

                padding: 30px 22px;
            }


            .form-title {

                font-size: 35px;
            }
        }

    </style>

</head>


<body>


<!-- =================================
     NAVBAR
================================= -->

<header class="navbar">


    <a href="/" class="logo">

        <div class="logo-icon">
            🍴
        </div>

        Meal <span>Mate</span>

    </a>


    <a href="/" class="home-link">
        Home
    </a>


    <div class="nav-right">

        <a
            href="/open_signin"
            class="signin-link">

            Sign in

        </a>


        <a
            href="/open_signup"
            class="account-button">

            Create account

        </a>

    </div>


</header>



<!-- =================================
     SIGNUP PAGE
================================= -->

<main class="page">


    <div class="signup-container">


        <!-- ============================
             LEFT FOOD IMAGE
        ============================= -->

        <section class="food-section">


            <img
                class="food-image"
                src="https://images.unsplash.com/photo-1555949258-eb67b1ef0ceb?auto=format&fit=crop&w=1000&q=85"
                alt="Delicious Meal"
            >


            <div class="food-content">


                <div class="food-small">

                    GOOD FOOD, GOOD TIMING

                </div>


                <h2 class="food-title">

                    Meal <span>Mate</span>

                </h2>


                <p class="food-description">

                    Delicious food, happy moments.
                    Create your account and discover
                    your favorite meals.

                </p>


                <div class="food-tag">

                    ✦ Good Food Brings Good Mood

                </div>


            </div>


        </section>



        <!-- ============================
             RIGHT FORM
        ============================= -->

        <section class="form-section">


            <h1 class="form-title">

                Create Account

            </h1>


            <p class="form-subtitle">

                Join Meal Mate and satisfy your hunger! 😊

            </p>


            <!-- IMPORTANT:
                 Keep your Django signup URL
            -->

            <form
                method="POST"
                action="/signup">

                {% csrf_token %}


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- MOBILE -->

                <div class="form-group">

                    <label for="mobile">
                        Mobile
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter your mobile number"
                        required
                    >

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter your address"
                        required
                    ></textarea>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="create-button">

                    Create Account →

                </button>


            </form>


            <!-- SIGN IN -->

            <div class="bottom-text">

                Already have an account?

                <a href="/open_signin">
                    Sign In
                </a>

            </div>


        </section>


    </div>


</main>


</body>

</html>
